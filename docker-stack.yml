    environment:
      <<: *frontend-environment
      PORT: "3104"
      SERVER_PORT: "3104"
      SERVICE_PORT: "3104"
      APP_BASE_HREF: /crecilandia/restaurante/
      API_URL: https://grupowagj.duckdns.org/crecilandia/restaurante-api
      WS_URL: https://grupowagj.duckdns.org/crecilandia/restaurante-api/ws-inventario
      SSR_API_URL: http://crecilandia-restaurante-backend:8104
    volumes: [crecilandia-restaurante-frontend-data:/app/data, /etc/timezone:/etc/timezone:ro]
    networks: [public-net]
    deploy:
      <<: *deploy-defaults
      replicas: 0
      resources: {limits: {cpus: "1", memory: 48M}}
      labels:
        - traefik.enable=true
        - "traefik.http.routers.crecilandia-restaurante.rule=Host(`grupowagj.duckdns.org`) && PathPrefix(`/crecilandia/restaurante`)"
        - traefik.http.routers.crecilandia-restaurante.entrypoints=websecure
        - traefik.http.routers.crecilandia-restaurante.tls.certresolver=letsencrypt
        - traefik.http.routers.crecilandia-restaurante.middlewares=rate-limit,strip-crecilandia-restaurante
        - traefik.http.routers.crecilandia-restaurante.priority=10
        - traefik.http.routers.crecilandia-restaurante.service=crecilandia-restaurante-frontend
        - traefik.http.middlewares.strip-crecilandia-restaurante.stripprefix.prefixes=/crecilandia/restaurante
        - traefik.http.services.crecilandia-restaurante-frontend.loadbalancer.server.port=3104
