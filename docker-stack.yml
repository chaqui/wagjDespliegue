x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-deploy-defaults: &deploy-defaults
  # Evita mantener simultáneamente la tarea antigua y la nueva en hosts con poca memoria.
  update_config: {parallelism: 1, delay: 10s, failure_action: rollback, monitor: 30s, order: stop-first}
  restart_policy: {condition: on-failure, delay: 5s, max_attempts: 3, window: 120s}

x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: postgres
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_DATASOURCE_URL: ${DB_URL}
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  DB_URL: ${DB_URL}
  DB_USER: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JAVA_OPTS: -Xms64m -Xmx128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled
  SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
  LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL: INFO
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  AUTH_SERVICE_URL: http://auth-service:8082

x-frontend-environment: &frontend-environment
  NODE_ENV: production
  ORIGIN: https://grupowagj.duckdns.org
  API_AUTH_URL: https://grupowagj.duckdns.org/usuarios-api/api
  AUTH_LOGIN: https://grupowagj.duckdns.org/usuarios/login
  SSR_API_AUTH_URL: http://auth-service:8082
  LOG_LEVEL: info
  LOG_FORMAT: json
  ENABLE_SSR: "false"
  CACHE_TTL: "3600"
  SSR_USE_INTERNAL_URLS: "true"

services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sistema_public-net
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.forwardedHeaders.insecure=true
      - --entrypoints.websecure.forwardedHeaders.insecure=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    environment:
      - DOCKER_API_VERSION=${DOCKER_API_VERSION}
    ports:
      - {target: 80, published: 80, protocol: tcp, mode: ingress}
      - {target: 443, published: 443, protocol: tcp, mode: ingress}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    networks: [public-net]
    deploy:
      <<: *deploy-defaults
      replicas: 0
      resources: {limits: {cpus: "0.5", memory: 64M}}
      labels:
        - traefik.enable=true
        - "traefik.http.routers.dashboard.rule=Host(`grupowagj.duckdns.org`) && (PathPrefix(`/traefik/api`) || PathPrefix(`/traefik/dashboard`))"
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=auth-basic,strip-traefik
        - traefik.http.middlewares.strip-traefik.stripprefix.prefixes=/traefik
        - traefik.http.middlewares.auth-basic.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
        - traefik.http.services.traefik.loadbalancer.server.port=80
        - traefik.http.middlewares.rate-limit.ratelimit.average=100
        - traefik.http.middlewares.rate-limit.ratelimit.burst=50
    logging: *default-logging

  auth-service:
    image: ghcr.io/chaqui/auth-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=${DB_SCHEMA}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=-Xms64m -Xmx176m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled
      - SERVER_FORWARD_HEADERS_STRATEGY=FRAMEWORK
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=INFO
    volumes:
      - {type: bind, source: ./keys, target: /app/keys}
      - {type: bind, source: ./logs/auth, target: /app/logs}
      - {type: bind, source: ./certs, target: /app/certs, read_only: true}
    networks: [public-net]
    deploy:
      <<: *deploy-defaults
      replicas: 1
      placement: {preferences: [{spread: node.id}]}
      resources: {limits: {cpus: "1", memory: 288M}}
      labels:
        - traefik.enable=true
        - "traefik.http.routers.auth.rule=Host(`grupowagj.duckdns.org`) && PathPrefix(`/usuarios-api`)"
        - traefik.http.routers.auth.entrypoints=websecure
        - traefik.http.routers.auth.tls.certresolver=letsencrypt
        - traefik.http.routers.auth.middlewares=rate-limit,strip-auth
        - traefik.http.middlewares.strip-auth.stripprefix.prefixes=/usuarios-api
        - traefik.http.middlewares.auth-rewrite.replacepathregex.regex=^/usuarios-api/(.*)
        - traefik.http.middlewares.auth-rewrite.replacepathregex.replacement=/api/$${1}
        - traefik.http.services.auth.loadbalancer.server.port=8082
        - traefik.http.services.auth.loadbalancer.sticky.cookie=true
        - traefik.http.services.auth.loadbalancer.sticky.cookie.name=auth_session
        - traefik.http.services.auth.loadbalancer.sticky.cookie.secure=true
    healthcheck:
      test: [CMD-SHELL, "test -s /app/keys/public_key.pem || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Spring/JPA puede tardar varios minutos en iniciar en la instancia.
      # Durante este período Docker no contabiliza fallos del healthcheck.
      start_period: 240s
    logging: *default-logging

  frontend-usuarios:
    image: ghcr.io/chaqui/frontend-usuarios:main
    environment:
      - API_URL=https://grupowagj.duckdns.org/usuarios-api/api
    networks: [public-net]
    deploy:
      <<: *deploy-defaults
      replicas: 0
      resources: {limits: {cpus: "0.5", memory: 48M}}
      labels:
        - traefik.enable=true
        - "traefik.http.routers.frontend-usuarios.rule=Host(`grupowagj.duckdns.org`) && (PathPrefix(`/usuarios`) || Path(`/`))"
        - traefik.http.routers.frontend-usuarios.entrypoints=websecure
        - traefik.http.routers.frontend-usuarios.tls.certresolver=letsencrypt
        - traefik.http.routers.frontend-usuarios.middlewares=rate-limit,usuarios-strip
        - traefik.http.routers.frontend-usuarios.tls=true
        - traefik.http.routers.frontend-usuarios.priority=10
        - traefik.http.middlewares.usuarios-strip.stripprefix.prefixes=/usuarios
        - traefik.http.services.frontend-usuarios.loadbalancer.server.port=80
    logging: *default-logging

