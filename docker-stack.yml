x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-defaults: &deploy-defaults
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback
    monitor: 30s
    order: start-first
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

# ============================================================
# SERVICIOS
# ============================================================
services:

  # ──────────────────────────────────────────────────────────
  # TRAEFIK - Proxy Inverso / API Gateway
  # Dashboard: https://clinica-ixquic.duckdns.org/traefik/dashboard/
  # ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sistema_public-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.websecure.forwardedHeaders.insecure=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
      - "--accesslog=true"
    environment:
      - DOCKER_API_VERSION=${DOCKER_API_VERSION}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    networks:
      - public-net
    deploy:
      <<: *deploy-defaults
      replicas: 0
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      labels:
        - "traefik.enable=true"
        # Dashboard — generar hash: echo $(htpasswd -nb admin pass) | sed -e s/\\$/\\$\\$/g
        # Dashboard accesible en: https://clinica-ixquic.duckdns.org/traefik/dashboard/
        - "traefik.http.routers.dashboard.rule=Host(`clinica-ixquic.duckdns.org`) && (PathPrefix(`/traefik/api`) || PathPrefix(`/traefik/dashboard`))"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.middlewares=auth-basic,strip-traefik"
        - "traefik.http.middlewares.strip-traefik.stripprefix.prefixes=/traefik"
        # Hash generado con: echo $(htpasswd -nb admin TuPassword) | sed -e 's/\$/\$\$/g'
        - "traefik.http.middlewares.auth-basic.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
        # Puerto explícito para evitar el error "port is missing" al auto-descubrirse
        - "traefik.http.services.traefik.loadbalancer.server.port=80"
        # Rate limiting global
        - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
        - "traefik.http.middlewares.rate-limit.ratelimit.burst=50"
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # AUTH SERVICE - Backend de gestión de usuarios
  # Imagen:   ghcr.io/chaqui/auth-service:latest
  # Ruta:     https://clinica-ixquic.duckdns.org/auth → :8082
  # ──────────────────────────────────────────────────────────
  auth-service:
    image: ghcr.io/chaqui/auth-service:latest
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=${DB_SCHEMA}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled
      - SERVER_FORWARD_HEADERS_STRATEGY=FRAMEWORK
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
    volumes:
      - type: bind
        source: ./keys
        target: /app/keys
      - type: bind
        source: ./logs/auth
        target: /app/logs
      - type: bind
        source: ./certs
        target: /app/certs
        read_only: true
      # Carpeta con llave pública para compartir con otros servicios
      - type: bind
        source: ./pubkeys
        target: /app/keys/public
    networks:
      - public-net
    deploy:
      replicas: 1
      placement:
        preferences:
          - spread: node.id
      resources:
        limits:
          cpus: '1'
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.auth.rule=Host(`clinica-ixquic.duckdns.org`) && PathPrefix(`/usuarios-api`)"
        - "traefik.http.routers.auth.entrypoints=websecure"
        - "traefik.http.routers.auth.tls.certresolver=letsencrypt"
        - "traefik.http.routers.auth.middlewares=rate-limit,strip-auth"
        - "traefik.http.middlewares.strip-auth.stripprefix.prefixes=/usuarios-api"
        - "traefik.http.middlewares.auth-rewrite.replacepathregex.regex=^/usuarios-api/(.*)"
        - "traefik.http.middlewares.auth-rewrite.replacepathregex.replacement=/api/$${1}"
        - "traefik.http.services.auth.loadbalancer.server.port=8082"
        # Sticky sessions: misma réplica para la misma sesión
        - "traefik.http.services.auth.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.auth.loadbalancer.sticky.cookie.name=auth_session"
        - "traefik.http.services.auth.loadbalancer.sticky.cookie.secure=true"
    healthcheck:
      test: ["CMD-SHELL", "test -r /app/keys/public_key.pem && test -s /app/keys/public_key.pem || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # FRONTEND USUARIOS - UI de gestión de usuarios
  # Imagen:   ghcr.io/chaqui/frontend-usuarios:latest
  # Ruta:     https://clinica-ixquic.duckdns.org/usuarios → :80
  # ──────────────────────────────────────────────────────────
  frontend-usuarios:
    image:  ghcr.io/chaqui/frontend-usuarios:latest
    environment:
      - API_URL=https://clinica-ixquic.duckdns.org/usuarios-api/api
    networks:
      - public-net
    deploy:
      <<: *deploy-defaults
      replicas: 0
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.frontend-usuarios.rule=Host(`clinica-ixquic.duckdns.org`) && (PathPrefix(`/usuarios`) || Path(`/`))"
        - "traefik.http.routers.frontend-usuarios.entrypoints=websecure"
        - "traefik.http.routers.frontend-usuarios.tls.certresolver=letsencrypt"
        - "traefik.http.routers.frontend-usuarios.middlewares=rate-limit,usuarios-strip"
        - "traefik.http.routers.frontend-usuarios.tls=true"
        - "traefik.http.routers.frontend-usuarios.priority=10"
        - "traefik.http.middlewares.usuarios-strip.stripprefix.prefixes=/usuarios"
        - "traefik.http.services.frontend-usuarios.loadbalancer.server.port=80"
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # INVENTARIO BACKEND - Backend core
  # Imagen:   ghcr.io/chaqui/inventario:latest
  # Ruta:     https://clinica-ixquic.duckdns.org/api → :8080
  # ─────────────────────────────────────────────── ───────────
  inventario-backend:
    image: ghcr.io/chaqui/inventario:latest
    environment:
      # Perfil Spring Boot (postgres activa la configuración PostgreSQL)
      - SPRING_PROFILES_ACTIVE=postgres
      # Base de datos PostgreSQL (RDS / externo)
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SCHEMA=${DB_SCHEMA_INVENTARIO}
      # Seguridad
      - JWT_SECRET=${JWT_SECRET}
      # JVM tuning
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled
      # Cabeceras de proxy (Traefik → Spring Security reconoce HTTPS/forwarded)
      - SERVER_FORWARD_HEADERS_STRATEGY=FRAMEWORK
      # Logging detallado
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=INFO
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG
      - LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
      - LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL=TRACE
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      # Integración interna
      - AUTH_SERVICE_URL=http://auth-service:8082
      - SERVICE_NAME=clinica-backend
      - SERVICE_PORT=8080
      - SERVICE_URL=http://clinica-backend:8080
    volumes:
      - clinica-uploads:/app/uploads
      - clinica-logs:/var/log/clinica-medica
      - type: bind
        source: ./certs
        target: /app/certs
        read_only: true
      - type: bind
        source: ./keys
        target: /app/keys
      - type: bind
        source: ./logs/clinica-backend
        target: /app/logs
      # Carpeta con llave pública para compartir con otros servicios
      - type: bind
        source: ./pubkeys
        target: /app/keys/public
        read_only: true
      - type: bind
        source: ./data/inventario
        target: /uploads
      
    networks:
      - public-net
    deploy:
      <<: *deploy-defaults
      replicas: 0
      resources:
        limits:
          cpus: '1'
          memory: 512M
      labels:
        - "traefik.enable=true"
        # ── Router REST API ──────────────────────────────────────
        - "traefik.http.routers.inventario-api.rule=Host(`clinica-ixquic.duckdns.org`) && PathPrefix(`/inventario-api`)"
        - "traefik.http.routers.inventario-api.entrypoints=websecure"
        - "traefik.http.routers.inventario-api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.inventario-api.middlewares=rate-limit,strip-inventario-api"
        - "traefik.http.routers.inventario-api.priority=1"
        - "traefik.http.routers.inventario-api.service=inventario-api"
        # ── Router WebSocket / SockJS (prioridad mayor, sin rate-limit) ──
        - "traefik.http.routers.inventario-ws.rule=Host(`clinica-ixquic.duckdns.org`) && PathPrefix(`/inventario-api/ws-inventario`)"
        - "traefik.http.routers.inventario-ws.entrypoints=websecure"
        - "traefik.http.routers.inventario-ws.tls.certresolver=letsencrypt"
        - "traefik.http.routers.inventario-ws.middlewares=strip-inventario-api"
        - "traefik.http.routers.inventario-ws.priority=10"
        - "traefik.http.routers.inventario-ws.service=inventario-api"
        # ── Middleware path rewrite (compartido) ─────────────────
        - "traefik.http.middlewares.strip-inventario-api.replacepathregex.regex=^/inventario-api(.*)"
        - "traefik.http.middlewares.strip-inventario-api.replacepathregex.replacement=$${1}"
        # ── Servicio backend ─────────────────────────────────────
        - "traefik.http.services.inventario-api.loadbalancer.server.port=8080"
        # Sticky sessions: misma réplica para la misma sesión (importante para WebSocket)
        - "traefik.http.services.inventario-api.loadbalancer.sticky.cookie=true"
        - "traefik.http.services.inventario-api.loadbalancer.sticky.cookie.name=auth_session"
        - "traefik.http.services.inventario-api.loadbalancer.sticky.cookie.secure=true"
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # FRONTEND CLÍNICA - Frontend principal (core)
  # Imagen:   ghcr.io/chaqui/frontend-clinica:latest
  # Ruta:     https://clinica-ixquic.duckdns.org/ → :3000
  # ──────────────────────────────────────────────────────────
  frontend-inventario:
    image:  ghcr.io/chaqui/frontend-inventario:latest
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=https://clinica-ixquic.duckdns.org
      - APP_BASE_HREF=/clinica/
      # URLs públicas para el browser (client-side)
      - API_URL=https://clinica-ixquic.duckdns.org/inventario-api
      - API_AUTH_URL=https://clinica-ixquic.duckdns.org/usuarios-api/api
      - AUTH_LOGIN=https://clinica-ixquic.duckdns.org/usuarios/login
      - WS_URL=https://clinica-ixquic.duckdns.org/inventario-api/ws-inventario
      - URL_CATALOGO=https://clinica-ixquic.duckdns.org/catalogos
      # URLs internas para SSR (evitan el bloqueo SSRF de Angular 19+)
      - SSR_API_URL=http://clinica-backend:8080
      - SSR_API_AUTH_URL=http://auth-service:8082
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ENABLE_SSR=false
      - CACHE_TTL=3600
      - SSR_USE_INTERNAL_URLS=true

    volumes:
      - clinica-frontend-data:/app/data
      - /etc/timezone:/etc/timezone:ro
    networks:
      - public-net
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
      labels:
        - "traefik.enable=true"
        # Router principal: sirve el frontend bajo /clinica, stripping el prefijo antes de pasar al SSR
        - "traefik.http.routers.frontend-core.rule=Host(`clinica-ixquic.duckdns.org`) && (PathPrefix(`/clinica`))"
        - "traefik.http.routers.frontend-core.entrypoints=websecure"
        - "traefik.http.routers.frontend-core.tls.certresolver=letsencrypt"
        - "traefik.http.routers.frontend-core.middlewares=rate-limit,strip-clinica"
        - "traefik.http.routers.frontend-core.priority=1"
        - "traefik.http.middlewares.strip-clinica.stripprefix.prefixes=/clinica"
        - "traefik.http.services.frontend-core.loadbalancer.server.port=3000"
    logging: *default-logging

  # ──────────────────────────────────────────────────────────
  # CATÁLOGOS BACKEND
  # Imagen:   ghcr.io/chaqui/catalogos:main
  # Ruta:     https://clinica-ixquic.duckdns.org/catalogos → :3001
  # ──────────────────────────────────────────────────────────
  catalogos:
    image: ghcr.io/chaqui/catalogos:main
    environment:
      - DB=postgres
      - DB_DATABASE=postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SCHEMA=${DB_SCHEMA_CATALOGOS:-catalogos}
      - AUTH_SERVICE_URL=http://auth-service:8082
      - SERVICE_NAME=catalogos
      - SERVICE_PORT=3001
      - SERVICE_URL=http://catalogos:3001

    networks:
      - public-net
    deploy:
      <<: *deploy-defaults
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.catalogos.rule=Host(`clinica-ixquic.duckdns.org`) && PathPrefix(`/catalogos`)"
        - "traefik.http.routers.catalogos.entrypoints=websecure"
        - "traefik.http.routers.catalogos.tls.certresolver=letsencrypt"
        - "traefik.http.routers.catalogos.middlewares=rate-limit,strip-catalogos"
        - "traefik.http.middlewares.strip-catalogos.stripprefix.prefixes=/catalogos"
        - "traefik.http.services.catalogos.loadbalancer.server.port=3001"
    logging: *default-logging
    volumes:
      - type: bind
        source: ./pubkeys
        target: /app/keys/public
      - type: bind
        source: ./keys
        target: /app/keys
      

# ============================================================
# REDES
# ============================================================
networks:
  public-net:
    external: true
    name: sistema_public-net

# ============================================================
# VOLÚMENES (solo de aplicación, sin BDs)
# ============================================================
volumes:
  traefik-certificates:
    driver: local
  clinica-uploads:
    driver: local
  clinica-logs:
    driver: local
  clinica-frontend-data:
    driver: local

